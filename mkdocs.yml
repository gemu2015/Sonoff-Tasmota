site_name: TinyC for Tasmota
site_description: C scripting for Tasmota — browser-compiled bytecode running on ESP32 and ESP8266
site_url: https://gemu2015.github.io/Sonoff-Tasmota/
repo_url: https://github.com/gemu2015/Sonoff-Tasmota
repo_name: gemu2015/Sonoff-Tasmota
edit_uri: edit/universal/tinyc_docs/
copyright: Copyright &copy; 2026 Gerhard Mutz

docs_dir: tinyc_docs
site_dir: site

# Example pages are auto-generated by scripts/build_tinyc_docs.py and linked
# from examples/index.md — they don't need to be listed individually in nav.
# Gallery images only appear once a user drops screenshots into tinyc_docs/images/.
validation:
  nav:
    omitted_files: ignore
  links:
    absolute_links: ignore
    unrecognized_links: ignore

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    logo: material/chip
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      width: 100%
      height: auto
      zoomable: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Reference:
      - English: reference.md
      - Deutsch: reference_de.md
  - Custom Builds: custom-builds.md
  - Examples:
      - Overview: examples/index.md
  - Gallery:
      - Overview: gallery/index.md
      - Displays: gallery/displays.md
      - Charts: gallery/charts.md
      - Cameras: gallery/cameras.md
      - Sensors: gallery/sensors.md
  - Releases: releases.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/gemu2015/Sonoff-Tasmota
