; =============================================================================
; platformio_override.ini — DFRobot FireBeetle 2 ESP32-S3 AI CAM (DFR1154) mit TinyC
; =============================================================================
; Diese Datei gehört in die Wurzel des Baums als  platformio_override.ini  (sie steht
; in der .gitignore und kommt nicht mit dem git pull). Hast du schon eine, dann hänge
; diese Abschnitte an. Dazu gehört  tasmota/user_config_override.h  aus demselben Ordner.
; Anleitung: tasmota/tinyc/dfrobot/ANLEITUNG.md
;
;   pio run -e dfrobot-ai-cam           Kamera + Personenerkennung (ESP-DL) + TinyC
;   pio run -e dfrobot-ai-cam-matter    dasselbe mit eingebautem Matter (+33 KB RAM, immer)
;   pio run -e tasmota32-plugin         nur für das Audio-Plugin (build_plugin.py ruft das)
;
; ⚠️ Zwischen build_flags und seiner Fortsetzungszeile darf KEIN Kommentar stehen —
;    das bricht die Fortsetzung, und die Schalter fallen still weg.
; =============================================================================

[env:tinyc_base]
build_flags             = ${env:tasmota32_base.build_flags}
                          -DTINYC_TESTING
                          -DUSE_TINYC_REPO_IDE

; --- DFR1154: ESP32-S3, 16 MB Flash, 8 MB OPI-PSRAM, native USB (kein UART-Chip) ---
; Der ESP-DL-Block (Include-Pfade, CONFIG_PIX_CVT_*, libfbs_model, lib_deps=symlink)
; ist nicht optional: siehe ANLEITUNG.md, Abschnitt „Personenerkennung".
[env:dfrobot-ai-cam]
extends                 = env:tasmota32_base
board                   = esp32s3_16M
board_build.f_cpu       = 240000000L
board_build.mcu         = esp32s3
build_unflags           = -DARDUINO_USB_MODE=0
                          -DARDUINO_USB_CDC_ON_BOOT=0
build_flags             = ${env:tinyc_base.build_flags}
                          -DARDUINO_USB_MODE=1
                          -DARDUINO_USB_CDC_ON_BOOT=1
                          -DUSE_USB_CDC_CONSOLE
                          -DCONFIG_NIMBLE_CPP_IDF
                          -DTINYC_CAMERA
                          -DTINYC_NO_LVGL
                          -DUSE_TINYC_ESPDL
                          -Ilib/libesp32_dl/esp-dl/dl
                          -Ilib/libesp32_dl/esp-dl/dl/tool/include
                          -Ilib/libesp32_dl/esp-dl/dl/tensor/include
                          -Ilib/libesp32_dl/esp-dl/dl/base
                          -Ilib/libesp32_dl/esp-dl/dl/base/isa
                          -Ilib/libesp32_dl/esp-dl/dl/base/isa/tie728
                          -Ilib/libesp32_dl/esp-dl/dl/base/isa/xtensa
                          -Ilib/libesp32_dl/esp-dl/dl/math/include
                          -Ilib/libesp32_dl/esp-dl/dl/model/include
                          -Ilib/libesp32_dl/esp-dl/dl/module/include
                          -Ilib/libesp32_dl/esp-dl/fbs_loader/include
                          -Ilib/libesp32_dl/esp-dl/vision/detect
                          -Ilib/libesp32_dl/esp-dl/vision/image
                          -Ilib/libesp32_dl/esp-dl/vision/image/isa
                          -DCONFIG_PIX_CVT_RGB888_TO_RGB888_SUPPORT=1
                          -DCONFIG_PIX_CVT_RGB888_TO_GRAY_SUPPORT=1
                          -DCONFIG_PIX_CVT_RGB565_TO_RGB888_SUPPORT=1
                          -Llib/libesp32_dl/esp-dl/fbs_loader/lib/esp32s3
                          -lfbs_model
lib_deps                = symlink://lib/libesp32_dl/esp-dl
monitor_port            = /dev/cu.usbmodem*
monitor_speed           = 115200
lib_ignore              = ${env:tasmota32_base.lib_ignore}
                          TTGO TWatch Library
                          Micro-RTSP
                          epdiy
lib_extra_dirs          = ${common.lib_extra_dirs}
                          lib/libesp32
                          lib/libesp32_div
                          ${platformio.packages_dir}/framework-arduinoespressif32/libraries/AsyncUDP

; --- dasselbe mit eingebautem Matter ---
; Die eingebaute Engine kostet ~33 KB statisches RAM, auch wenn Matter nie startet.
; Wer Matter nur gelegentlich braucht: lieber als Plugin (docs/MATTER_PLUGIN_DE.md).
[env:dfrobot-ai-cam-matter]
extends                 = env:dfrobot-ai-cam
build_flags             = ${env:dfrobot-ai-cam.build_flags}
                          -DTINYC_MATTER
                          -DMTRC_ATTEST_TEST_CREDS

; --- dasselbe, Matter nur als Plugin (Firmware ohne die Engine) ---
[env:dfrobot-ai-cam-mtrplugin]
extends                 = env:dfrobot-ai-cam
build_flags             = ${env:dfrobot-ai-cam.build_flags}
                          -DTINYC_MATTER
                          -DMTRC_ATTEST_TEST_CREDS
                          -DUSE_MATTER_C_PLUGIN_ONLY

; --- Plugin-Host: nur für tasmota/Plugins/build_plugin.py (Audio-, Matter-Plugin ...) ---
; Unverändert aus gemus Baum. Das Plugin muss mit denselben Compiler-Schaltern gebaut
; werden wie die Firmware, die es lädt.
[env:tasmota32-plugin]
extends                 = env:tasmota32_base
board                   = esp32
; -fno-merge-constants / -fno-merge-all-constants are CRITICAL: with
; constant-merging on, the compiler deduplicates identical string
; literals across translation units, which shifts the plugin's
; PROGMEM layout and module_header relocation. The original
; tasmota32-4M env had these as build_flags additions and tasmota32-
; plugin's first standalone refactor missed them — leading to a
; iniz-time NULL deref at the start of mod_func_execute.
; -fno-stack-protector matches the firmware-side build for ABI compat.
build_flags             = ${env:tasmota32_base.build_flags}
                          -Dplugin_host_build
                          -fno-merge-constants
                          -fno-merge-all-constants
                          -fno-stack-protector
; matter BinPlugin (xblib_02/03): amalgamated mtrc_crypto.c + the full matter_c
; need the plugin's matter/include copy + the BearSSL br_* TYPE headers (no br_*
; symbols linked). -fpermissive: matter_c is C amalgamated into a .cpp -> downgrade
; the C-ism const-char*->char* / int->enum conversions (xblib_03 full amalgamation).
                          -Itasmota/Plugins/matter/include
                          -Ilib/lib_ssl/bearssl-esp8266/src
                          -fpermissive
; -fno-lto: with LTO the large matter_c amalgamation's functions get scattered and
; fall OUTSIDE the module's start/end sync markers, so grepmodule extracts an empty
; (~764 B) module. Disabling LTO places each fn predictably in the bracket (matches
; the C3 plugin env). Only matters for the big xblib_03 amalgamation.
                          -fno-lto
build_unflags           = ${env:tasmota32_base.build_unflags}
                          -fmerge-constants -fmerge-all-constants -fstack-protector -flto -flto=auto -flto=thin
; the framework compiles with -fno-builtin-memset/-memcpy/-bzero; that decouples a
; user redeclaration from the builtin, so the memset/memcpy the COMPILER emits for
; zero-init/struct copies kept calling the HOST memset (317 sites in the matter
; plugin) instead of the module-local mtrc_memset (blib_audit, 26.09.2026)
                          -fno-builtin-memset -fno-builtin-memcpy -fno-builtin-bzero
lib_ignore              = ${env:tasmota32_base.lib_ignore}
                          esp32-camera
                          TTGO TWatch Library
                          Micro-RTSP
                          epdiy
                          lib/libesp32/CORE2_Library
                          libesp32_lvgl
                          lib/libesp32_lvgl
                          lib/libesp32_audio
                          lib/libesp32_who
                          universal display Library
extra_scripts           = ${env:tasmota32_base.extra_scripts}
                          pre:tasmota/Plugins/patch_linker_file.py
                          post:tasmota/Plugins/grepmodule-firmware.py
