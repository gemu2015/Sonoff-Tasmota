<!DOCTYPE html><meta name=viewport content='width=device-width,initial-scale=1'><title>WAVE ROVER</title><style>body{font-family:sans-serif;margin:12px;text-align:center}#pad{width:280px;height:280px;margin:10px auto;border:2px solid #888;border-radius:50%;touch-action:none;position:relative}#dot{width:40px;height:40px;border-radius:50%;background:#2a7;position:absolute;left:120px;top:120px}</style><h3>WAVE ROVER</h3><div id=st>-</div><div id=pad><div id=dot></div></div><p>Speed limit <input type=range id=mx min=10 max=100 value=40 oninput='mxv.textContent=this.value'> <span id=mxv>40</span> %</p><button onclick='halt()'>STOP</button><p>Arrow keys / WASD also work. Motors stop 0.3 s after the last command.</p><script>var d=0,t=0,act=0,run=0,ctl=null,ks={},p=document.getElementById('pad'),dot=document.getElementById('dot');
function show(j){st.textContent=j.v+' V   L '+j.l+'   R '+j.r+'   stops '+j.wd+(j.lo?'   LOW BATTERY':'')+(j.cl?'   CLIFF '+j.cl:'')+(j.ob?'   OBSTACLE '+j.ob:'')+'   ticks '+j.el+'/'+j.er+(j.st?'   MOTOR STALL':'')}
function url(){return 'rover_cmd?d='+d+'&t='+t+'&m='+mx.value}
// ONE request in flight at a time: the rover answers in about 180 ms, a timer every 100 ms piled the requests up in the browser and the old drive commands ran on after the stick was released
function loop(){if(!run)return;ctl=new AbortController();fetch(url(),{signal:ctl.signal}).then(function(r){return r.json()}).then(show).catch(function(e){if(run)st.textContent='no link'}).then(function(){ctl=null;if(run)setTimeout(loop,10)})}
function go(){if(!run){run=1;loop()}}
function stop1(){fetch('rover_cmd?d=0&t=0&m='+mx.value).then(function(r){return r.json()}).then(show).catch(function(){})}
function halt(){d=0;t=0;run=0;dot.style.left='120px';dot.style.top='120px';if(ctl){ctl.abort();ctl=null}stop1();setTimeout(stop1,250)}
function mv(e){var r=p.getBoundingClientRect(),x=(e.clientX-r.left-140)/140,y=(e.clientY-r.top-140)/140,n=Math.hypot(x,y);if(n>1){x/=n;y/=n}t=Math.round(x*100);d=Math.round(-y*100);dot.style.left=(120+x*120)+'px';dot.style.top=(120+y*120)+'px'}
p.onpointerdown=function(e){p.setPointerCapture(e.pointerId);act=1;mv(e);go()};p.onpointermove=function(e){if(act)mv(e)};p.onpointerup=function(e){act=0;halt()};p.onpointercancel=p.onpointerup;
function kk(){d=(ks.ArrowUp||ks.w?100:0)-(ks.ArrowDown||ks.s?100:0);t=(ks.ArrowRight||ks.d?60:0)-(ks.ArrowLeft||ks.a?60:0);if(d||t){go()}else{halt()}}
document.onkeydown=function(e){if(!ks[e.key]){ks[e.key]=1;kk()}};document.onkeyup=function(e){ks[e.key]=0;kk()};window.onblur=function(){ks={};act=0;halt()};document.onvisibilitychange=function(){if(document.hidden){ks={};act=0;halt()}};</script>
