# I2SAUDIO pins for the Waveshare ESP32-S3-CAM (ES8311 loudspeaker codec + ES7210 microphone ADC) - delete to reset to plugin defaults
# Pins from the schematic Rev 1.1 (MCLK 10, SCLK 11, LRCK 12, ASDOUT 13 = microphone, DSDIN 14 = loudspeaker).
# CODEC 5 = this board. The loudspeaker amplifier is switched through the expander (EXIO4), not through a GPIO, so APWR stays unused (49).
# I2C: Gpio8 640 (SDA), Gpio7 608 (SCL) must be set in Tasmota; the plugin finds the codecs on bus 0.
DOUT,14
DIN/PDD,13
BCK,11
WS,12
MC,10
MODE,16777728
CODEC,16778501
APWR,49
PDC,49
