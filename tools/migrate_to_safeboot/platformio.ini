; PlatformIO config for the safeboot migrator.
;
; The output binary MUST fit in the OLD layout's `app1` slot (1856 KB),
; otherwise Tasmota's OTA handoff will reject it. Keep the build minimal:
; just Wi-Fi + WebServer + Preferences. No TLS, no mDNS, no extras.
;
; Build with:
;   pio run -d tools/migrate_to_safeboot

[env:migrator]
platform        = espressif32
framework       = arduino
board           = esp32dev          ; generic 4 MB ESP32; override per chip
upload_speed    = 921600
monitor_speed   = 115200

board_build.partitions = partitions_old.csv

; ── Wi-Fi credentials — RECOMMENDED for one-shot migration use.
;
; Setting these as build flags means the migrator boots straight onto
; your home network with no SoftAP / setup-form dance. Just OTA, click
; Migrate, done.
;
; Leave blank (or comment out) to fall back to the SoftAP path:
; the migrator comes up as `safeboot-migrate-XXXX` with password
; `safeboot1`, you join it from a phone/laptop, browse to its IP, and
; enter the home Wi-Fi creds via a form. Those get saved in the
; migrator's own NVS namespace, the device reboots, and STA comes up.
;
; Either path works; build-time creds are simpler and faster.

build_flags     = -DCONFIG_PARTITION_TABLE_CUSTOM=1
                  -DBOARD_HAS_PSRAM=0
                  -Os
                  -I${PROJECT_DIR}
                  '-DMIGRATOR_WIFI_SSID="${sysenv.MIGRATOR_WIFI_SSID}"'
                  '-DMIGRATOR_WIFI_PASS="${sysenv.MIGRATOR_WIFI_PASS}"'

; Strip everything we don't need for ~200 lines of WiFi/HTTP migrator
build_unflags   = -fno-rtti -std=gnu++11
build_type      = release

; The embedded blobs are large and CHANGE between safeboot rebuilds; tell
; pio they're sources so they get re-checksummed.
extra_scripts   = pre:embedded/check_blobs.py

; If you want the migrator OTA-deliverable straight from this env's
; output, keep the firmware filename predictable:
custom_firmware_name = migrate_to_safeboot.bin
